# Kurulum provası: GitHub'ın Ubuntu 24.04 makinesini yeni kiralanmış bir sunucu gibi hazırlar (root şifresiyle
# SSH, alan adı) ve gerçek yayının betikleriyle (yayin/yayinla.sh, sunucu/kur.sh, sunucu/depo-kur.sh) baştan
# sona kurar. Ardından HTTPS, güvenlik ayarları, yedek ve şifreli kopya, depolama sunucusu, yeniden başlatma
# sonrası kilit açma, ikinci yayın (güncelleme) ve ANA_SIFRE değişikliğine karşı koruma denenir.
# Gerçek sunuculara dokunmaz; gizli değerler her çalışmada rastgele üretilir.
name: Kurulum provası

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sunucu/**'
      - 'yayin/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'scripts/migrate.mjs'
      - 'scripts/create-admin.mjs'
      - '.github/actions/**'
      - '.github/workflows/prova.yml'
      - '.github/workflows/yayin.yml'

permissions:
  contents: read

concurrency:
  group: prova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prova:
    name: Uçtan uca kurulum
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ALAN: olcekhane.test
      U: /srv/olcekhane/uygulama
    steps:
      - uses: actions/checkout@v7

      - name: Çalışma alanı
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt || true
          # Büyük dosyalar için en çok boş alanı olan disk.
          if [ "$(df --output=avail -B1G /mnt 2>/dev/null | tail -n1 | tr -d ' ' || echo 0)" -ge 30 ]; then YER=/mnt/prova; else YER=/var/prova; fi
          sudo mkdir -p "$YER" && sudo chown "$USER" "$YER"
          echo "YER=$YER" >> "$GITHUB_ENV"
          sudo apt-get install -y -q openssh-server sshpass age >/dev/null
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q cryptography
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: Uygulama görüntüsü
        uses: ./.github/actions/goruntu
        with:
          cikti: ${{ env.YER }}/goruntu.tar.zst

      - name: Sunucu benzetimi (sağlayıcı varsayılanları, alan adı, gizli değerler)
        run: |
          set -eu
          KOK=$(openssl rand -hex 16); echo "::add-mask::$KOK"
          ANA=$(openssl rand -hex 32); echo "::add-mask::$ANA"
          echo "root:$KOK" | sudo chpasswd
          # Birçok sağlayıcı gibi: root şifreyle SSH ile girebilir (kurulum bunu kapatmalı).
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\nKbdInteractiveAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/60-saglayici.conf >/dev/null
          sudo systemctl enable ssh >/dev/null 2>&1 || true
          sudo systemctl restart ssh
          { echo "SUNUCU_ROOT_SIFRE=$KOK"; echo "DEPO_ROOT_SIFRE=$KOK"; echo "ANA_SIFRE=$ANA"; } >> "$GITHUB_ENV"
          echo "127.0.0.1 $ALAN www.$ALAN" | sudo tee -a /etc/hosts >/dev/null
          python3 - "$RUNNER_TEMP/prova.env" <<'EOF'
          import re, sys
          s = open("yayin/ayarlar.env", encoding="utf-8").read()
          deger = {
              "SUNUCU_ADRESI": "127.0.0.1", "DEPO_ADRESI": "127.0.0.1", "SITE_DOMAIN": "olcekhane.test",
              "ACME_EMAIL": "teknik@olcekhane.test", "MAIL_FROM": "'Ölçekhane <bilgi@olcekhane.test>'",
              "ADMIN_EMAIL": "yonetici@olcekhane.test",
              "COMPANY_LEGAL_NAME": "'Prova Eğitim Teknolojileri A.Ş.'", "COMPANY_ADDRESS": "'Prova Cad. No: 1 #2, Çankaya/Ankara'",
              "COMPANY_MERSIS": "0000000000000000", "COMPANY_TAX_OFFICE": "Çankaya", "COMPANY_TAX_NO": "0000000000",
              "COMPANY_PHONE": "'+90 312 000 00 00'", "COMPANY_EMAIL": "bilgi@olcekhane.test",
              "COMPANY_KVKK_EMAIL": "kvkk@olcekhane.test", "COMPANY_KEP": "prova@hs01.kep.tr",
          }
          for k, v in deger.items():
              s, n = re.subn(rf"^{k}=.*$", f"{k}={v}", s, flags=re.M)
              assert n == 1, k
          s += "\nCADDY_GENEL_AYAR=local_certs\n"
          open(sys.argv[1], "w", encoding="utf-8").write(s)
          EOF

      - name: 1 · İlk kurulum (root şifresiyle)
        env:
          AYARLAR: ${{ runner.temp }}/prova.env
          GORUNTU: ${{ env.YER }}/goruntu.tar.zst
          SUNUCU_ORTAM: OLCEKHANE_VERI_DOSYASI=${{ env.YER }}/veri/veri.img OLCEKHANE_VERI_GB=12
        run: bash yayin/yayinla.sh kur

      - name: 2 · HTTPS, sayfalar ve güvenlik ayarları
        run: |
          set -eu
          dc() { sudo docker compose --project-directory "$U" -f "$U/docker-compose.yml" "$@"; }
          dc exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/kok.crt"
          C=(curl --cacert "$RUNNER_TEMP/kok.crt" -sS -m 20)
          for _ in $(seq 1 30); do "${C[@]}" -f "https://$ALAN/api/saglik" >/dev/null 2>&1 && break; sleep 2; done
          test "$("${C[@]}" "https://$ALAN/api/saglik")" = '{"durum":"ok"}'
          for yol in / /testler /hakkimizda /yasal/aydinlatma-metni /giris /sifremi-unuttum /robots.txt /sitemap.xml; do
            kod=$("${C[@]}" -o /dev/null -w '%{http_code}' "https://$ALAN$yol")
            echo "$yol -> $kod"; test "$kod" = 200
          done
          "${C[@]}" "https://$ALAN/yasal/aydinlatma-metni" | grep -q 'Prova Eğitim Teknolojileri A.Ş.'
          "${C[@]}" "https://$ALAN/yasal/aydinlatma-metni" | grep -q 'Prova Cad. No: 1 #2'
          "${C[@]}" "https://$ALAN/robots.txt" | grep -qi 'disallow: /'
          "${C[@]}" -D - -o /dev/null "https://$ALAN/" | grep -qi '^strict-transport-security: max-age=31536000'
          "${C[@]}" -D - -o /dev/null "https://www.$ALAN/hakkimizda" | grep -qi "^location: https://$ALAN/hakkimizda"
          curl -sS -m 10 -D - -o /dev/null "http://$ALAN/" | grep -qi "^location: https://$ALAN/"
          echo "--- güvenlik"
          test "$(sudo sshd -T | grep -cE '^(passwordauthentication|permitrootlogin) no$')" = 2
          if SSHPASS=$SUNUCU_ROOT_SIFRE sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o ConnectTimeout=10 root@127.0.0.1 true 2>/dev/null; then
            echo "::error title=Güvenlik::Kurulumdan sonra root hâlâ şifreyle SSH ile girebiliyor."; exit 1
          fi
          sudo ufw status | grep -q '^Status: active'
          test "$(sudo docker info --format '{{.DockerRootDir}}')" = /srv/olcekhane/docker
          test "$(findmnt -no SOURCE /srv/olcekhane)" = /dev/mapper/olcekhane-veri
          sudo cryptsetup status olcekhane-veri | grep -q 'LUKS2'
          test "$(sudo stat -c %a "$U/.env")" = 600
          if sudo ss -ltnH | grep -E '(0\.0\.0\.0|\*|\[::\]):(5432|3000)\b'; then echo "::error title=Güvenlik::Veritabanı ya da uygulama portu dışarı açık."; exit 1; fi
          test "$(dc exec -T db psql -U olcekhane -d olcekhane -Atc "select role from users where email = 'yonetici@olcekhane.test'")" = admin
          if systemctl is-enabled docker.service >/dev/null 2>&1; then echo "::error title=Güvenlik::Docker açılışta kendiliğinden başlıyor."; exit 1; fi
          echo "::notice title=Prova 2::HTTPS, sayfalar, şirket bilgileri, yönlendirmeler, SSH/UFW/şifreli disk/portlar ve yönetici hesabı doğru. Docker depolama sürücüsü: $(sudo docker info --format '{{.Driver}}'); /var/lib/containerd: $(sudo du -sh /var/lib/containerd 2>/dev/null | cut -f1)."

      - name: 3 · Yedek, şifreli kopya ve depolama sunucusu
        env:
          AYARLAR: ${{ runner.temp }}/prova.env
        run: |
          set -eu
          dc() { sudo docker compose --project-directory "$U" -f "$U/docker-compose.yml" "$@"; }
          dc exec -T yedek bash /usr/local/bin/yedekle simdi
          bash yayin/yayinla.sh depo
          f=$(sudo ls /srv/olcekhane-yedek | grep -E '^olcekhane-[0-9]{8}-[0-9]{6}\.dump\.age$' | tail -n1)
          test -n "$f"
          python3 yayin/turet.py "$RUNNER_TEMP/anahtar"
          sudo cat "/srv/olcekhane-yedek/$f" | age -d -i "$RUNNER_TEMP/anahtar/yedek.key" > "$RUNNER_TEMP/yedek.dump"
          tablo=$(dc exec -T yedek pg_restore --list < "$RUNNER_TEMP/yedek.dump" | grep -c 'TABLE DATA')
          test "$tablo" -ge 10
          # Depolama sunucusunun anahtarı yalnızca okuyabilir: yazma ve kabuk reddedilir.
          if sudo rsync -e "ssh -i /root/.ssh/olcekhane_cek -o BatchMode=yes" /etc/hostname yedekci@127.0.0.1: 2>/dev/null; then echo "::error title=Güvenlik::Yedek okuma hesabıyla yazılabildi."; exit 1; fi
          if sudo ssh -i /root/.ssh/olcekhane_cek -o BatchMode=yes yedekci@127.0.0.1 'cat /etc/passwd' 2>/dev/null | grep -q root; then echo "::error title=Güvenlik::Yedek okuma hesabıyla kabuk açılabildi."; exit 1; fi
          echo "::notice title=Prova 3::Yedek alındı; şifreli kopya depolama sunucusuna çekildi ve ANA_SIFRE'den türetilen anahtarla açıldı ($tablo tablo). Okuma hesabı yazamıyor, kabuk açamıyor."

      - name: 4 · Yeniden başlatma benzetimi ve kilit açma
        env:
          AYARLAR: ${{ runner.temp }}/prova.env
        run: |
          set -eu
          dc() { sudo docker compose --project-directory "$U" -f "$U/docker-compose.yml" "$@"; }
          C=(curl --cacert "$RUNNER_TEMP/kok.crt" -sS -m 10)
          dc exec -T db psql -U olcekhane -d olcekhane -qc "create table if not exists prova_isareti (deger text)" -c "insert into prova_isareti values ('$GITHUB_RUN_ID')"
          sudo systemctl stop docker.socket docker.service
          if swapon --show=NAME --noheadings | grep -q /srv/olcekhane; then sudo swapoff /srv/olcekhane/swapfile; fi
          sudo umount /srv/olcekhane
          sudo cryptsetup close olcekhane-veri
          if "${C[@]}" -f "https://$ALAN/api/saglik" >/dev/null 2>&1; then echo "::error::Veri alanı kapalıyken site açık kaldı."; exit 1; fi
          sudo systemctl start docker.service || true
          if systemctl is-active --quiet docker; then echo "::error title=Güvenlik::Veri alanı kapalıyken Docker başlayabildi."; exit 1; fi
          bash yayin/yayinla.sh ac
          for _ in $(seq 1 30); do "${C[@]}" -f "https://$ALAN/api/saglik" >/dev/null 2>&1 && break; sleep 2; done
          "${C[@]}" -f "https://$ALAN/api/saglik"
          test "$(dc exec -T db psql -U olcekhane -d olcekhane -Atc 'select count(*) from prova_isareti')" -ge 1
          echo "::notice title=Prova 4::Veri alanı kapanınca site ve Docker durdu; kilit açma sonrası site döndü, veriler yerinde."

      - name: 5 · İkinci yayın (güncelleme; veriler korunur)
        env:
          AYARLAR: ${{ runner.temp }}/prova.env
          GORUNTU: ${{ env.YER }}/goruntu.tar.zst
        run: |
          set -eu
          dc() { sudo docker compose --project-directory "$U" -f "$U/docker-compose.yml" "$@"; }
          bash yayin/yayinla.sh kur
          test "$(dc exec -T db psql -U olcekhane -d olcekhane -Atc 'select count(*) from prova_isareti')" -ge 1
          test "$(sudo find "$U/yedekler" -name 'olcekhane-*.dump' | wc -l)" -ge 2
          curl --cacert "$RUNNER_TEMP/kok.crt" -fsS "https://$ALAN/api/saglik"
          echo "::notice title=Prova 5::İkinci yayın sorunsuz; güncellemeden önce yedek alındı, veriler korundu."

      - name: 6 · ANA_SIFRE değişirse yayın durur, site etkilenmez
        env:
          AYARLAR: ${{ runner.temp }}/prova.env
        run: |
          set -eu
          # Çıktı atılır: beklenen bağlantı hatası özet uyarısı olarak görünmesin.
          if ANA_SIFRE=$(openssl rand -hex 32) bash yayin/yayinla.sh ac >/dev/null 2>&1; then
            echo "::error title=Güvenlik::Farklı bir ANA_SIFRE ile sunucuya bağlanılabildi."; exit 1
          fi
          curl --cacert "$RUNNER_TEMP/kok.crt" -fsS "https://$ALAN/api/saglik"
          echo "::notice title=Prova 6::Farklı ANA_SIFRE ile bağlanılamadı; site çalışmaya devam ediyor."

      - name: Hata ayrıntıları
        if: failure()
        run: |
          dc() { sudo docker compose --project-directory "$U" -f "$U/docker-compose.yml" "$@"; }
          not() { local m; m=$(tail -n 40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'); echo "::error title=$1::$m"; }
          dc ps -a 2>&1 | not "kapsayıcılar" || true
          for s in app caddy db yedek; do dc logs --no-color --tail 40 "$s" 2>&1 | not "$s kaydı"; done
          sudo journalctl -u docker -u ssh --no-pager -n 40 2>&1 | not "sistem kaydı" || true
