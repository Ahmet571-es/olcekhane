# Yayın: Denetim'den geçen her işlemeyi Almanya'daki sunucuya kurar (yayin/yayinla.sh → sunucu/kur.sh).
# Sunucu adresi (yayin/ayarlar.env) ya da ANA_SIFRE (GitHub Secrets) henüz yoksa hiçbir şey yapmaz.
# Elle çalıştırma (Actions → Yayın → Run workflow): yeniden yayın, uygulamayı yeniden başlatma, durum.
name: Yayın

on:
  workflow_run:
    workflows: [Denetim]
    types: [completed]
    branches: [main]
  schedule:
    # Pazartesi 04:07 (Türkiye): temel görüntülerin (Node, Caddy) güvenlik güncellemeleri.
    - cron: '7 1 * * 1'
  workflow_dispatch:
    inputs:
      islem:
        description: Yapılacak iş
        type: choice
        default: yayinla
        options: [yayinla, baslat, durum]

permissions:
  contents: read
  actions: read

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayin:
    name: Sunucuya yayın
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ISLEM: ${{ inputs.islem || 'yayinla' }}
    steps:
      # Yalnızca Denetim'den geçmiş bir işleme yayına alınır: Denetim'in ardından gelen çalışmada o işleme,
      # zamanlanmış ve elle çalıştırmada main dalında Denetim'den en son başarıyla geçen işleme.
      - name: Yayına alınacak işleme
        id: isleme
        env:
          GH_TOKEN: ${{ github.token }}
          OLAY: ${{ github.event_name }}
          DENETLENEN: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$OLAY" = workflow_run ]; then
            sha=$DENETLENEN
          else
            sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow Denetim --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha')
          fi
          [ -n "$sha" ] || { echo "::error title=Yayın::Denetim'den geçmiş bir işleme bulunamadı."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice title=Yayına alınan işleme::$sha"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.isleme.outputs.sha }}

      - name: Ayarlar hazır mı
        id: hazir
        env:
          ANA_SIFRE: ${{ secrets.ANA_SIFRE }}
        run: |
          deger() { sed -n "s/^$1=//p" yayin/ayarlar.env | tail -n1 | tr -d "'\" "; }
          if [ -z "$(deger SUNUCU_ADRESI)" ]; then
            echo "::notice title=Yayın atlandı::Sunucu adresi henüz yazılmadı (yayin/ayarlar.env: SUNUCU_ADRESI)."
            echo "hazir=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$ANA_SIFRE" ]; then
            echo "::warning title=Yayın atlandı::GitHub Secrets'ta ANA_SIFRE tanımlı değil (yayin/REHBER.md)."
            echo "hazir=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "hazir=true"; echo "alan=$(deger SITE_DOMAIN)"; } >> "$GITHUB_OUTPUT"

      - name: Araçlar
        if: steps.hazir.outputs.hazir == 'true'
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q sshpass >/dev/null
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q cryptography
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: Uygulama görüntüsü
        if: steps.hazir.outputs.hazir == 'true' && env.ISLEM == 'yayinla'
        uses: ./.github/actions/goruntu
        with:
          cikti: ${{ runner.temp }}/goruntu.tar.zst
          tazele: ${{ github.event_name == 'schedule' }}

      - name: Sunucuya kur ve yayına al
        if: steps.hazir.outputs.hazir == 'true' && env.ISLEM == 'yayinla'
        env:
          ANA_SIFRE: ${{ secrets.ANA_SIFRE }}
          SUNUCU_ROOT_SIFRE: ${{ secrets.SUNUCU_ROOT_SIFRE }}
          GORUNTU: ${{ runner.temp }}/goruntu.tar.zst
        run: bash yayin/yayinla.sh kur

      - name: Uygulamayı yeniden başlat
        if: steps.hazir.outputs.hazir == 'true' && env.ISLEM == 'baslat'
        env:
          ANA_SIFRE: ${{ secrets.ANA_SIFRE }}
        run: bash yayin/yayinla.sh baslat

      - name: Sunucu durumu
        if: steps.hazir.outputs.hazir == 'true'
        env:
          ANA_SIFRE: ${{ secrets.ANA_SIFRE }}
        run: bash yayin/yayinla.sh durum

      - name: Site dışarıdan açılıyor mu
        if: steps.hazir.outputs.hazir == 'true' && env.ISLEM != 'durum'
        env:
          ALAN: ${{ steps.hazir.outputs.alan }}
        run: |
          acik=0
          for _ in 1 2 3 4 5 6; do
            if curl -fsS -m 15 "https://$ALAN/api/saglik" >/dev/null 2>&1; then acik=1; break; fi
            sleep 20
          done
          if [ "$acik" != 1 ]; then
            echo "::warning title=Site dışarıdan açılmıyor::https://$ALAN yanıt vermiyor. Alan adının DNS kaydı sunucuyu henüz göstermiyor ya da sertifika alınamadı olabilir (yayin/REHBER.md, DNS)."
            exit 0
          fi
          echo "::notice title=Site açık::https://$ALAN yanıt veriyor."
          # Bir ziyaretçinin yapacağı gibi: sayfalar, test raporu ve PDF (örnek cevaplarla; hiçbir şey saklanmaz).
          C=(curl -sS -m 30 -A 'olcekhane-yayin-denetimi')
          sorun=""
          # Uzman incelemesindeki (önizleme) testler de bağlantıyla açılmalı. Site sahibinin 2026-10-07 kararıyla testler
          # hoca onayı beklenmeden yayına alındığı için liste şimdilik boştur.
          ONIZLEME=""
          for yol in / /testler /testler/oz-saygi /testler/oz-saygi/coz ${ONIZLEME:+$(printf ' /testler/%s' $ONIZLEME)} '/testler/ayrintili-kisilik-profili/coz?sinif=yetiskin' /okuma /ilkokul-1-2 '/testler/sesli-okuma-degerlendirmesi/coz?sinif=3' /okuma/kayit-isleyici.js /iletisim /yasal/aydinlatma-metni; do
            kod=$("${C[@]}" -o /dev/null -w '%{http_code}' "https://$ALAN$yol") || kod=000
            [ "$kod" = 200 ] || sorun="$sorun $yol=$kod"
          done
          GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 7, "data": {"engine": "likert", "answers": {f"R{i}": {"value": i % 4, "rtMs": 2500} for i in range(1, 11)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$GOVDE" "https://$ALAN/api/rapor/oz-saygi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["student"]["items"] and r["parent"]["items"]; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 1 and m["settings"] is None and len(m["weeks"]) == 4'; then
            sorun="$sorun rapor"
          fi
          # Meslek İlgi Alanları: 91 madde (35. madde çıkarıldı), sıralı ilgi raporu; keşif yol haritası.
          ILGI_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"o{i:02d}": {"value": i % 5 + 1, "rtMs": 2500} for i in range(1, 93) if i != 35}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$ILGI_GOVDE" "https://$ALAN/api/rapor/meslek-ilgi-alanlari" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert len(r["student"]["chart"]["rows"]) == 8 and r["parent"]["items"]; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 8 and len(m["weeks"]) == 4 and m["study"]["items"] and not m["preview"]'; then
            sorun="$sorun ilgi-raporu"
          fi
          # Ayrıntılı Kişilik Profili: 116 madde (Liberalizm alt boyutu çıkarıldı), beş boyut ve alt özellikleri; yol haritası.
          KISILIK_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"k{i:03d}": {"value": i % 5 + 1, "rtMs": 2500} for i in range(1, 121) if i not in (28, 58, 88, 118)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$KISILIK_GOVDE" "https://$ALAN/api/rapor/ayrintili-kisilik-profili" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert [len(g["facets"]) for g in r["parent"]["groups"]] == [6, 6, 6, 6, 5]; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 5 and len(m["approach"]["items"]) == 5 and not m["preview"]'; then
            sorun="$sorun kisilik-raporu"
          fi
          # Altı Boyutlu Kişilik Profili: 240 madde (24 alt özellik × 10), altı boyut ve dörder alt özellik; yol haritası.
          ALTI_GOVDE=$(python3 -c 'import json; p="sinc fair gree mode fear anxi depe sent expr socb soci live forg gent flex pati orga dili perf prud aesa inqu crea unco".split(); print(json.dumps({"grade": 11, "data": {"engine": "likert", "answers": {f"{k}{n:02d}": {"value": (i + n) % 5 + 1, "rtMs": 2500} for i, k in enumerate(p) for n in range(1, 11)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$ALTI_GOVDE" "https://$ALAN/api/rapor/alti-boyutlu-kisilik-profili" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert [len(g["facets"]) for g in r["parent"]["groups"]] == [4, 4, 4, 4, 4, 4]; m=r["student"]["roadmap"]; assert len(m["bars"]) == 6 and len(m["weeks"]) == 4 and not m["preview"]'; then
            sorun="$sorun alti-boyutlu-rapor"
          fi
          # Duygusal Zekâ Bileşenleri: 66 madde (empc04 ve empc07 çıkarıldı), yedi ayrı ölçek, toplam puan yok; yol haritası
          # (öneriler en belirgin üç bileşen için).
          DZ_GOVDE=$(python3 -c 'import json; n={"pexp": 9, "nexp": 10, "atte": 10, "edec": 9, "rjoy": 10, "rdis": 10, "empc": 10}; print(json.dumps({"grade": 9, "data": {"engine": "likert", "answers": {f"{k}{i:02d}": {"value": (j + i) % 5 + 1, "rtMs": 2500} for j, k in enumerate(n) for i in range(1, n[k] + 1) if f"{k}{i:02d}" not in ("empc04", "empc07")}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$DZ_GOVDE" "https://$ALAN/api/rapor/duygusal-zeka-bilesenleri" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert len(r["parent"]["chart"]["rows"]) == 7 and len(r["student"]["items"]) == 7 and "toplam bir puan yoktur" in r["student"]["chartNote"]; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 7 and len(m["study"]["items"]) == 3 and len(m["approach"]["items"]) == 3 and not m["preview"]'; then
            sorun="$sorun duygusal-zeka-raporu"
          fi
          # Beş Faktör: raporun sonunda gelişim yol haritası (beş boyutlu üç boyutlu profil, dört hafta, veliye öneriler).
          BF_GOVDE=$(python3 -c 'import json; k=[f"{p}{i}" for i in range(1, 11) for p in ["E", "A", "C", "ES", "I"]]; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {x: {"value": n % 5 + 1, "rtMs": 2500} for n, x in enumerate(k)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$BF_GOVDE" "https://$ALAN/api/rapor/bes-faktor-kisilik" |
            python3 -c 'import json,sys; m=json.load(sys.stdin)["parent"]["roadmap"]; assert len(m["bars"]) == 5 and len(m["weeks"]) == 4 and len(m["approach"]["items"]) == 5 and not m["preview"]'; then
            sorun="$sorun yol-haritasi"
          fi
          # Hızlı Kişilik Testi: 20 madde (m01–m20), beş boyut ölçüm payıyla; yol haritası Beş Faktör'ünkü. Yetişkin olarak
          # (14) yalnızca kişisel rapor, veliye öneriler yok.
          HK_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"m{i:02d}": {"value": i % 5 + 1, "rtMs": 2500} for i in range(1, 21)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$HK_GOVDE" "https://$ALAN/api/rapor/hizli-kisilik-testi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); rows=r["parent"]["chart"]["rows"]; assert len(rows) == 5 and all(x["ciLow"] is not None for x in rows) and len(r["student"]["items"]) == 5 and "dört cümleyle" in r["student"]["chartNote"]; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 5 and len(m["approach"]["items"]) == 5 and not m["preview"]'; then
            sorun="$sorun hizli-kisilik-raporu"
          fi
          HK_YETISKIN=$(printf '%s' "$HK_GOVDE" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["grade"]=14; print(json.dumps(b))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$HK_YETISKIN" "https://$ALAN/api/rapor/hizli-kisilik-testi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert list(r) == ["adult"] and r["adult"]["gradeLabel"] == "Yetişkin" and r["adult"]["roadmap"]["approach"] is None'; then
            sorun="$sorun hizli-kisilik-yetiskin"
          fi
          # Düşünmeyi Sevme Ölçeği: 10 madde (n01–n10), tek ölçek ölçüm payıyla; sonuç kartından sonra "Bilmekte yarar var"; yol haritasında
          # tek sütun, ortamlar yok, 2. hafta "Kafa yoran küçük bir deneme". Yetişkin olarak (14) yalnızca kişisel rapor.
          NFC_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"n{i:02d}": {"value": i % 5 + 1, "rtMs": 2500} for i in range(1, 11)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$NFC_GOVDE" "https://$ALAN/api/rapor/dusunmeyi-sevme-olcegi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); rows=r["parent"]["chart"]["rows"]; assert len(rows) == 1 and rows[0]["ciLow"] is not None and [x["title"] for x in r["student"]["items"]] == ["Düşünmeyi sevme", "Bilmekte yarar var"]; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 1 and m["settings"] is None and len(m["approach"]["items"]) == 1 and m["weeks"][1]["title"] == "Kafa yoran küçük bir deneme" and not m["preview"]'; then
            sorun="$sorun dusunmeyi-sevme-raporu"
          fi
          NFC_YETISKIN=$(printf '%s' "$NFC_GOVDE" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["grade"]=14; print(json.dumps(b))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$NFC_YETISKIN" "https://$ALAN/api/rapor/dusunmeyi-sevme-olcegi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert list(r) == ["adult"] and r["adult"]["gradeLabel"] == "Yetişkin" and r["adult"]["roadmap"]["approach"] is None'; then
            sorun="$sorun dusunmeyi-sevme-yetiskin"
          fi
          # Düşünme ve Çalışma Tarzı: 50 madde (beş ölçek × 10: cpx, inv, cpr, enl, org), beş ölçek ölçüm payıyla; yol haritasında
          # beş sütun, ortamlar yok, 2. hafta "Çalışma düzeni". Yetişkin olarak (14) yalnızca kişisel rapor.
          DCT_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"{k}{i:02d}": {"value": (j + i) % 5 + 1, "rtMs": 2500} for j, k in enumerate(["cpx", "inv", "cpr", "enl", "org"]) for i in range(1, 11)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$DCT_GOVDE" "https://$ALAN/api/rapor/dusunme-ve-calisma-tarzi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); rows=r["parent"]["chart"]["rows"]; assert len(rows) == 5 and all(x["ciLow"] is not None for x in rows) and len(r["student"]["items"]) == 5 and "10 cümleyle" in r["student"]["chartNote"]; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 5 and m["settings"] is None and len(m["approach"]["items"]) == 5 and m["weeks"][1]["title"] == "Çalışma düzeni" and not m["preview"]'; then
            sorun="$sorun dusunme-calisma-raporu"
          fi
          DCT_YETISKIN=$(printf '%s' "$DCT_GOVDE" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["grade"]=14; print(json.dumps(b))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$DCT_YETISKIN" "https://$ALAN/api/rapor/dusunme-ve-calisma-tarzi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert list(r) == ["adult"] and r["adult"]["gradeLabel"] == "Yetişkin" and r["adult"]["roadmap"]["approach"] is None'; then
            sorun="$sorun dusunme-calisma-yetiskin"
          fi
          # Heyecan Arayışı: 29 madde (dan 9, deprem maddesi dan03 yok; imp 10; cal 10), üç ölçek, ölçüm payı yok; ilk madde
          # "Birlikte bakınca"; yol haritasında üç sütun, ortamlar var, 2. hafta "Plan ve anlık kararlar".
          HEY_GOVDE=$(python3 -c 'import json; n={"dan": 10, "imp": 10, "cal": 10}; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"{k}{i:02d}": {"value": (j + i) % 5 + 1, "rtMs": 2500} for j, k in enumerate(n) for i in range(1, n[k] + 1) if f"{k}{i:02d}" != "dan03"}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$HEY_GOVDE" "https://$ALAN/api/rapor/heyecan-arayisi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); rows=r["parent"]["chart"]["rows"]; assert len(rows) == 3 and all(x["ciLow"] is None for x in rows) and r["student"]["items"][0]["title"] == "Birlikte bakınca" and len(r["student"]["items"]) == 4; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 3 and m["settings"] is not None and len(m["approach"]["items"]) == 3 and m["weeks"][1]["title"] == "Plan ve anlık kararlar" and not m["preview"]'; then
            sorun="$sorun heyecan-raporu"
          fi
          # Empati: 29 madde (und 10; aff 9, aff09 yok; war 10, war09 yok), üç ölçek, ölçüm payı yok; ilk madde "Birlikte
          # bakınca"; yol haritasında üç sütun, ortamlar var, 2. hafta "Dinle ve anla".
          EMP_GOVDE=$(python3 -c 'import json; n={"und": 10, "aff": 10, "war": 11}; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"{k}{i:02d}": {"value": (j + i) % 5 + 1, "rtMs": 2500} for j, k in enumerate(n) for i in range(1, n[k] + 1) if f"{k}{i:02d}" not in ("aff09", "war09")}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$EMP_GOVDE" "https://$ALAN/api/rapor/empati" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); rows=r["parent"]["chart"]["rows"]; assert len(rows) == 3 and all(x["ciLow"] is None for x in rows) and r["student"]["items"][0]["title"] == "Birlikte bakınca" and len(r["student"]["items"]) == 4; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 3 and m["settings"] is not None and len(m["approach"]["items"]) == 3 and m["weeks"][1]["title"] == "Dinle ve anla" and not m["preview"]'; then
            sorun="$sorun empati-raporu"
          fi
          # Kişilerarası Tarz: 32 madde, sekiz tarz çember grafiğinde; yol haritası (öneriler en belirgin üç tarz için).
          TARZ_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"ipc{i:02d}": {"value": i % 5 + 1, "rtMs": 2500} for i in range(1, 33)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$TARZ_GOVDE" "https://$ALAN/api/rapor/kisilerarasi-tarz" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); c=r["student"]["chart"]; assert c["type"] == "circle" and len(c["axes"]) == 8 and len(r["parent"]["items"]) == 8; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 8 and len(m["study"]["items"]) == 3 and len(m["approach"]["items"]) == 3 and m["weeks"][1]["title"] == "Birlikte çalışırken" and not m["preview"]'; then
            sorun="$sorun kisilerarasi-tarz-raporu"
          fi
          # 16 Faktörlü Kişilik Profili: 160 madde (g01, g03 ve g05 çıkarıldı), 16 ayrı ölçek, toplam puan yok; yol haritasında
          # 16 sütun, öneriler en belirgin altı özellik için.
          ONALTI_GOVDE=$(python3 -c 'import json; n={"a": 10, "b": 13, "c": 10, "e": 10, "f": 10, "g": 10, "h": 10, "i": 10, "l": 10, "m": 10, "n": 10, "o": 10, "q1_": 10, "q2_": 10, "q3_": 10, "q4_": 10}; print(json.dumps({"grade": 11, "data": {"engine": "likert", "answers": {f"{k}{i:02d}": {"value": (j + i) % 5 + 1, "rtMs": 2500} for j, k in enumerate(n) for i in range(1, n[k] + 1) if f"{k}{i:02d}" not in ("g01", "g03", "g05")}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$ONALTI_GOVDE" "https://$ALAN/api/rapor/16-faktorlu-kisilik-profili" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert len(r["parent"]["chart"]["rows"]) == 16 and len(r["student"]["items"]) == 16 and "toplam bir puan yoktur" in r["student"]["chartNote"]; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 16 and len(m["study"]["items"]) == 6 and len(m["approach"]["items"]) == 6 and m["weeks"][1]["title"] == "Çalışma düzeni" and not m["preview"]'; then
