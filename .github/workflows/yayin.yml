          # Desen Hatırlama: 39 desenin hepsi doğru (DH_DESEN testin desenleridir, her desenin dolu kareleri; tests/desen-hatirlama.test.ts
          # güncel olduğunu denetler): en büyük doğru desen 15 kare, hata yok, 13 büyüklüğün hepsi grafikte; yol haritasında üç boyutlu grafik yok.
          DH_DESEN=(0,1,4 0,1,5 0,3,4 2,3,4,7 2,4,6,7 3,4,6,7 0,6,7,9,10 0,5,6,10,11 2,3,7,8,9 0,1,3,5,10,11 3,4,6,7,8,9 1,4,5,7,8,10 2,4,5,9,10,14,15 1,4,7,8,9,13,14 2,3,4,6,8,13,14 3,4,5,8,10,11,13,14 0,6,7,8,10,12,13,15 0,1,3,5,8,10,12,14 0,1,2,7,9,10,11,17,18 2,5,6,11,13,15,17,18,19 1,3,4,9,12,13,15,16,17 3,5,8,11,12,14,15,17,18,19 0,3,4,5,11,12,13,15,16,19 1,2,4,5,6,10,12,14,17,18 0,4,5,7,8,10,17,18,21,22,24 4,5,7,11,12,14,15,16,18,21,23 0,3,4,9,11,13,16,19,21,22,24 2,3,4,8,10,11,12,18,19,21,22,23 1,2,4,7,8,9,14,16,17,20,23,24 2,5,7,8,9,11,12,14,15,20,21,23 0,4,7,9,10,11,12,15,17,19,20,27,28 2,4,5,7,9,10,11,15,18,19,24,27,28 0,1,3,6,9,10,17,19,21,22,26,27,28 0,2,4,6,8,9,10,13,14,15,17,21,23,25 0,3,4,8,9,11,15,16,19,20,24,25,28,29 0,2,3,5,10,11,12,15,16,19,22,23,25,26 1,4,5,6,7,9,10,11,13,14,18,22,24,25,28 2,4,7,9,10,11,17,18,19,21,22,23,25,27,28 2,3,4,6,7,8,10,12,13,15,17,19,22,26,27)
          DH_GOVDE=$(python3 -c 'import json,sys; print(json.dumps({"grade": 6, "data": {"engine": "tasks", "seed": "6f1c2e0b-3e4b-4a8a-9a55-5d1f0c8e2a11", "blocks": {"desen-hatirlama": [{"index": i, "response": {"cells": [int(c) for c in x.split(",")]}, "rtMs": 6000} for i, x in enumerate(sys.argv[1:])]}}}))' "${DH_DESEN[@]}")
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$DH_GOVDE" "https://$ALAN/api/rapor/desen-hatirlama" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); s=r["student"]; assert [i["badge"] for i in s["items"]][0] == "15 kare (testin en büyük deseni)" and s["items"][2]["badge"] == "Hata yok" and len(s["chart"]["rows"]) == 13 and s["cautions"] == []; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 0 and len(m["approach"]["items"]) == 3 and not m["preview"]'; then
            sorun="$sorun desen-hatirlama-raporu"
          fi
          # Kâğıt Katlama: 24 sorunun hepsi doğru (s, testin cevap anahtarıdır; tests/kagit-katlama.test.ts güncel olduğunu
          # denetler). Çözme sayfasına cevap anahtarı, çeldiriciler ve yanılgı türleri gitmez.
          KK_GOVDE=$(python3 -c 'import json; s=[2, 3, 1, 5, 2, 4, 1, 4, 3, 5, 2, 1, 4, 3, 1, 2, 4, 3, 5, 1, 4, 3, 2, 5]; print(json.dumps({"grade": 6, "data": {"engine": "tasks", "seed": "6f1c2e0b-3e4b-4a8a-9a55-5d1f0c8e2a11", "blocks": {"kagit-katlama": [{"index": i, "response": s[i], "rtMs": 9000 + 1000 * i} for i in range(24)]}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$KK_GOVDE" "https://$ALAN/api/rapor/kagit-katlama" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); c=r["parent"]["chart"]; assert c["type"] == "bars" and len(c["rows"]) == 5 and len(r["student"]["items"]) == 4 and r["student"]["items"][0]["badge"] == "24 soruda 24 doğru"; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 3 and len(m["approach"]["items"]) == 3 and not m["preview"]'; then
            sorun="$sorun kagit-katlama-raporu"
          fi
          kk_sayfa=$("${C[@]}" -f "https://$ALAN/testler/kagit-katlama/coz?sinif=6") || kk_sayfa=""
          if ! grep -q 'Kâğıdı aç, delikleri bul' <<<"$kk_sayfa" || ! grep -qF '\"answers\":[]' <<<"$kk_sayfa" || ! grep -qF '\"lures\":[]' <<<"$kk_sayfa" || ! grep -qF '\"lureKinds\":[]' <<<"$kk_sayfa"; then
            sorun="$sorun kagit-katlama-anahtar"
          fi
          # Kelime Bilgisi: 24 sorunun hepsi doğru (s, testin cevap anahtarıdır; tests/kelime-bilgisi.test.ts güncel olduğunu
          # denetler). Çözme sayfasına cevap anahtarı, çeldiriciler ve yanılgı türleri gitmez.
          KB_GOVDE=$(python3 -c 'import json; s=[3, 4, 1, 4, 5, 1, 3, 2, 5, 4, 3, 2, 5, 2, 3, 4, 2, 1, 5, 4, 1, 2, 3, 1]; print(json.dumps({"grade": 6, "data": {"engine": "tasks", "seed": "6f1c2e0b-3e4b-4a8a-9a55-5d1f0c8e2a11", "blocks": {"kelime-bilgisi": [{"index": i, "response": s[i], "rtMs": 6000 + 500 * i} for i in range(24)]}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$KB_GOVDE" "https://$ALAN/api/rapor/kelime-bilgisi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); c=r["parent"]["chart"]; assert c["type"] == "bars" and len(c["rows"]) == 5 and len(r["student"]["items"]) == 4 and r["student"]["items"][0]["badge"] == "24 soruda 24 doğru"; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 4 and len(m["approach"]["items"]) == 3 and not m["preview"]'; then
            sorun="$sorun kelime-bilgisi-raporu"
          fi
          kb_sayfa=$("${C[@]}" -f "https://$ALAN/testler/kelime-bilgisi/coz?sinif=6") || kb_sayfa=""
          if ! grep -q 'Kelimelerin anlamını bul' <<<"$kb_sayfa" || ! grep -qF '\"answers\":[]' <<<"$kb_sayfa" || ! grep -qF '\"lures\":[]' <<<"$kb_sayfa" || ! grep -qF '\"lureKinds\":[]' <<<"$kb_sayfa"; then
            sorun="$sorun kelime-bilgisi-anahtar"
          fi
          # Kural Değiştirme: 98 denemenin hepsi doğru (s, her denemenin doğru düğmesidir; tests/kural-degistirme.test.ts güncel
          # olduğunu denetler); kural değişince daha yavaş cevaplar.
          KD_GOVDE=$(python3 -c 'import json; s=[1, 2, 1, 1, 2, 1, 2, 1, 2, 1, 2, 1, 2, 1, 2, 2, 2, 1, 1, 2, 1, 2, 1, 2, 2, 1, 1, 1, 2, 2, 1, 2, 1, 2, 2, 1, 2, 1, 2, 2, 1, 1, 1, 2, 1, 2, 1, 2, 1, 1, 1, 2, 1, 2, 2, 1, 1, 2, 2, 1, 2, 1, 2, 1, 2, 2, 2, 2, 1, 1, 1, 2, 2, 2, 1, 1, 1, 2, 1, 2, 1, 2, 1, 2, 1, 1, 1, 2, 1, 2, 2, 2, 1, 1, 2, 2, 1, 2]; print(json.dumps({"grade": 6, "data": {"engine": "tasks", "seed": "6f1c2e0b-3e4b-4a8a-9a55-5d1f0c8e2a11", "blocks": {"kural-degistirme": [{"index": i, "response": s[i], "rtMs": 700 + 200 * (i >= 32 and i not in (32, 65) and i % 2 == 0)} for i in range(98)]}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$KD_GOVDE" "https://$ALAN/api/rapor/kural-degistirme" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); c=r["parent"]["chart"]; assert c["type"] == "bars" and len(c["rows"]) == 3 and len(r["student"]["items"]) == 4 and r["student"]["items"][0]["badge"] == "%100 doğru"; m=r["parent"]["roadmap"]; assert m["bars"] == [] and len(m["approach"]["items"]) == 3 and not m["preview"]'; then
            sorun="$sorun kural-degistirme-raporu"
          fi
          # Kelime Listesi Hatırlama: ilk listenin üç denemesinde 5, 10 ve 15 kelime, ikinci listeden 5, sonra 15 kelime; tanımada
          # yalnızca ilk listedeki kelimelere "evet" (a ve b testin listeleri, k tanıma anahtarıdır: 1 evet, 2 hayır;
          # tests/kelime-listesi.test.ts güncel olduğunu denetler). Çözme sayfasına tanıma anahtarı gitmez.
          KL_GOVDE=$(python3 -c 'import json; a=["tavşan","pencere","limon","köprü","gitar","para","gömlek","çekiç","balon","kibrit","araba","bayrak","ayna","anahtar","kulak"]; b=["sabun","havuz","zarf","tabure","terazi","dürbün","mendil","yastık","pusula","heykel","kupa","sandık","şemsiye","maske","sepet"]; k=[1,1,1,2,2,2,1,2,1,1,2,2,2,1,2,2,2,1,2,1,1,2,2,2,1,1,2,1,2,2,2,1,2,2,1]; r=[a[:5], a[:10], a, b[:5], a]; print(json.dumps({"grade": 6, "data": {"engine": "tasks", "seed": "6f1c2e0b-3e4b-4a8a-9a55-5d1f0c8e2a11", "blocks": {"kelime-listesi": [{"index": i, "response": {"words": w}, "rtMs": 40000} for i, w in enumerate(r)] + [{"index": 5 + j, "response": x, "rtMs": 1200} for j, x in enumerate(k)]}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$KL_GOVDE" "https://$ALAN/api/rapor/kelime-listesi-hatirlama" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); c=r["parent"]["chart"]; assert c["type"] == "bars" and len(c["rows"]) == 5 and len(r["student"]["items"]) == 4 and r["student"]["items"][0]["badge"] == "5, 10 ve 15 kelime" and r["student"]["items"][2]["badge"] == "15/15 tanındı, 0 yanlış “evet”"; m=r["parent"]["roadmap"]; assert len(m["bars"]) == 3 and len(m["approach"]["items"]) == 3 and not m["preview"]'; then
            sorun="$sorun kelime-listesi-raporu"
          fi
          kl_sayfa=$("${C[@]}" -f "https://$ALAN/testler/kelime-listesi-hatirlama/coz?sinif=6") || kl_sayfa=""
          if ! grep -q 'Kelimeleri aklında tut' <<<"$kl_sayfa" || ! grep -qF '\"recognitionKey\":[]' <<<"$kl_sayfa"; then
            sorun="$sorun kelime-listesi-anahtar"
          fi
          # Sesli okuma: tarayıcı mikrofonu yalnızca izin başlığı açıksa kullanabilir; ses cihazda kalır, sunucuya yalnızca
          # işaretler, süreler ve cevaplar gelir. Örnek: 3. sınıf metni, iki yanlış okuma, bir yeniden anlatma fikri.
          "${C[@]}" -I "https://$ALAN/okuma" | grep -qi '^permissions-policy:.*microphone=(self)' || sorun="$sorun mikrofon-izni"
          # Otomatik analiz: model ve ONNX Runtime dosyaları kendi sunucumuzdan iner (yalnızca başlıklar; büyük dosyalar
          # indirilmez); test sayfası cross-origin isolated (COEP) açılır.
          analiz=$(node araclar/model-hazirla.mjs --adresler | awk '$1 ~ /\/(config|parcalar)\.json$/ || $1 ~ /\.parca-00$/ || $1 ~ /\.wasm$/ {print $1}') || analiz=""
          [ -n "$analiz" ] || sorun="$sorun model-adresleri"
          for yol in $analiz; do
            kod=$("${C[@]}" -I -o /dev/null -w '%{http_code}' "https://$ALAN$yol") || kod=000
            [ "$kod" = 200 ] || sorun="$sorun $yol=$kod"
          done
          "${C[@]}" -D - -o /dev/null "https://$ALAN/testler/sesli-okuma-degerlendirmesi/coz?sinif=3" | grep -qi '^cross-origin-embedder-policy: require-corp' || sorun="$sorun coep"
          SO_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 3, "data": {"engine": "oral", "passageKey": "g3-kus-yemligi", "recordMs": 110000, "readingMs": 100000, "timingAuto": True, "audio": {"quality": "good", "pauses": [[1000, 2500]], "speechMs": 80000, "contour": [50] * 120, "interrupted": False}, "marks": {"0": {"s": "sub"}, "5": {"s": "omit"}}, "listened": 1, "retell": {"recorded": True, "ideas": ["i1"]}, "answers": {f"q{i}": "a" for i in range(1, 9)}, "prosody": {"expression": 3, "phrasing": 3, "smoothness": 3, "pace": 3}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$SO_GOVDE" "https://$ALAN/api/rapor/sesli-okuma-degerlendirmesi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); o=r["parent"]["oral"]; assert r["parent"]["audienceName"] == "Veli ve öğretmen raporu" and len(r["student"]["keyFigures"]) == 6 and o["level"]["key"] in ("easy", "support", "hard") and o["counted"][0]["value"] == 1 and o["timeline"]'; then
            sorun="$sorun sesli-okuma-raporu"
          fi
          # Aynı test yetişkin olarak ("Yetişkinim", 14): yalnızca kişisel rapor.
          YETISKIN_GOVDE=$(printf '%s' "$KISILIK_GOVDE" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["grade"]=14; print(json.dumps(b))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$YETISKIN_GOVDE" "https://$ALAN/api/rapor/ayrintili-kisilik-profili" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert list(r) == ["adult"] and r["adult"]["gradeLabel"] == "Yetişkin"; m=r["adult"]["roadmap"]; assert m["settings"]["title"] == "İş ve meslek planı için" and m["approach"] is None'; then
            sorun="$sorun yetiskin-raporu"
          fi
          # Uzman incelemesindeki testler bağlantıyla açılır ama arama motorlarına kapalıdır. GitHub bir adımda en çok 10
          # bilgi notu gösterdiği için önizlemeler tek notta toplanır (yoksa sondaki "Site dışarıdan sınandı" notu görünmez).
          kapali=""
          acik=""
          for slug in $ONIZLEME; do
            if "${C[@]}" "https://$ALAN/testler/$slug" | grep -qi 'name="robots" content="noindex'; then
              kapali="$kapali $slug"
            else
              acik="$acik $slug"
            fi
          done
          if [ -n "$kapali" ]; then
            echo "::notice title=Önizleme::Uzman incelemesinde; bağlantıyla açılıyor, arama motorlarına kapalı:$kapali"
          fi
          if [ -n "$acik" ]; then
            echo "::notice title=Önizleme::Açılıyor ve herkese açık:$acik"
          fi
          PDF_GOVDE=$(printf '%s' "$GOVDE" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["audience"]="parent"; print(json.dumps(b))')
          if ! "${C[@]}" -f -m 60 -H 'content-type: application/json' -d "$PDF_GOVDE" -o "$RUNNER_TEMP/rapor.pdf" \
            "https://$ALAN/api/rapor/oz-saygi/pdf" || [ "$(head -c 5 "$RUNNER_TEMP/rapor.pdf")" != '%PDF-' ]; then
            sorun="$sorun pdf"
          fi
          # Site haritasındaki her sayfa (yeni rehber yazıları dahil) internetten açılmalı. Bu adıma yeni bilgi notu
          # eklenmez: sorunlu sayfalar aşağıdaki hata notunda listelenir.
          harita=$("${C[@]}" "https://$ALAN/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##') || harita=""
          for sayfa_adresi in $harita; do
            kod=$("${C[@]}" -o /dev/null -w '%{http_code}' "$sayfa_adresi") || kod=000
            [ "$kod" = 200 ] || sorun="$sorun $sayfa_adresi=$kod"
          done
          if [ -n "$sorun" ]; then
            echo "::error title=Site dışarıdan sınandı::Açılmayan ya da hatalı yanıt veren bölümler:$sorun"
            exit 1
          fi
          echo "::notice title=Site dışarıdan sınandı::Sayfalar, test raporu ve PDF indirme internetten çalışıyor."
          # Arama motorları: robots.txt bütün siteyi kapatıyor mu, site haritasında kaç sayfa var.
          if "${C[@]}" "https://$ALAN/robots.txt" | grep -qiE '^disallow: /[[:space:]]*$'; then
            echo "::notice title=Arama motorları::Kapalı (ALLOW_INDEXING=false): site Google'da görünmez."
          else
            sayfa=$("${C[@]}" "https://$ALAN/sitemap.xml" | grep -o '<loc>' | wc -l)
            echo "::notice title=Arama motorları::Açık: robots.txt taramaya izin veriyor, site haritasında $sayfa sayfa var."
          fi
