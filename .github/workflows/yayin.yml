# Yayın: Denetim'den geçen her işlemeyi Almanya'daki sunucuya kurar (yayin/yayinla.sh → sunucu/kur.sh).
# Sunucu adresi (yayin/ayarlar.env) ya da ANA_SIFRE (GitHub Secrets) henüz yoksa hiçbir şey yapmaz.
# Elle çalıştırma (Actions → Yayın → Run workflow): yeniden yayın, uygulamayı yeniden başlatma, durum.
name: Yayın

on:
  workflow_run:
    workflows: [Denetim]
    types: [completed]
    branches: [main]
  schedule:
    # Pazartesi 04:07 (Türkiye): temel görüntülerin (Node, Caddy) güvenlik güncellemeleri.
    - cron: '7 1 * * 1'
  workflow_dispatch:
    inputs:
      islem:
        description: Yapılacak iş
        type: choice
        default: yayinla
        options: [yayinla, baslat, durum]

permissions:
  contents: read
  actions: read

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayin:
    name: Sunucuya yayın
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ISLEM: ${{ inputs.islem || 'yayinla' }}
    steps:
      # Yalnızca Denetim'den geçmiş bir işleme yayına alınır: Denetim'in ardından gelen çalışmada o işleme,
      # zamanlanmış ve elle çalıştırmada main dalında Denetim'den en son başarıyla geçen işleme.
      - name: Yayına alınacak işleme
        id: isleme
        env:
          GH_TOKEN: ${{ github.token }}
          OLAY: ${{ github.event_name }}
          DENETLENEN: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$OLAY" = workflow_run ]; then
            sha=$DENETLENEN
          else
            sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow Denetim --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha')
          fi
          [ -n "$sha" ] || { echo "::error title=Yayın::Denetim'den geçmiş bir işleme bulunamadı."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice title=Yayına alınan işleme::$sha"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.isleme.outputs.sha }}

      - name: Ayarlar hazır mı
        id: hazir
        env:
          ANA_SIFRE: ${{ secrets.ANA_SIFRE }}
        run: |
          deger() { sed -n "s/^$1=//p" yayin/ayarlar.env | tail -n1 | tr -d "'\" "; }
          if [ -z "$(deger SUNUCU_ADRESI)" ]; then
            echo "::notice title=Yayın atlandı::Sunucu adresi henüz yazılmadı (yayin/ayarlar.env: SUNUCU_ADRESI)."
            echo "hazir=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$ANA_SIFRE" ]; then
            echo "::warning title=Yayın atlandı::GitHub Secrets'ta ANA_SIFRE tanımlı değil (yayin/REHBER.md)."
            echo "hazir=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "hazir=true"; echo "alan=$(deger SITE_DOMAIN)"; } >> "$GITHUB_OUTPUT"

      - name: Araçlar
        if: steps.hazir.outputs.hazir == 'true'
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q sshpass >/dev/null
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q cryptography
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: Uygulama görüntüsü
        if: steps.hazir.outputs.hazir == 'true' && env.ISLEM == 'yayinla'
        uses: ./.github/actions/goruntu
        with:
          cikti: ${{ runner.temp }}/goruntu.tar.zst
          tazele: ${{ github.event_name == 'schedule' }}

      - name: Sunucuya kur ve yayına al
        if: steps.hazir.outputs.hazir == 'true' && env.ISLEM == 'yayinla'
        env:
          ANA_SIFRE: ${{ secrets.ANA_SIFRE }}
          SUNUCU_ROOT_SIFRE: ${{ secrets.SUNUCU_ROOT_SIFRE }}
          GORUNTU: ${{ runner.temp }}/goruntu.tar.zst
        run: bash yayin/yayinla.sh kur

      - name: Uygulamayı yeniden başlat
        if: steps.hazir.outputs.hazir == 'true' && env.ISLEM == 'baslat'
        env:
          ANA_SIFRE: ${{ secrets.ANA_SIFRE }}
        run: bash yayin/yayinla.sh baslat

      - name: Sunucu durumu
        if: steps.hazir.outputs.hazir == 'true'
        env:
          ANA_SIFRE: ${{ secrets.ANA_SIFRE }}
        run: bash yayin/yayinla.sh durum

      - name: Site dışarıdan açılıyor mu
        if: steps.hazir.outputs.hazir == 'true' && env.ISLEM != 'durum'
        env:
          ALAN: ${{ steps.hazir.outputs.alan }}
        run: |
          acik=0
          for _ in 1 2 3 4 5 6; do
            if curl -fsS -m 15 "https://$ALAN/api/saglik" >/dev/null 2>&1; then acik=1; break; fi
            sleep 20
          done
          if [ "$acik" != 1 ]; then
            echo "::warning title=Site dışarıdan açılmıyor::https://$ALAN yanıt vermiyor. Alan adının DNS kaydı sunucuyu henüz göstermiyor ya da sertifika alınamadı olabilir (yayin/REHBER.md, DNS)."
            exit 0
          fi
          echo "::notice title=Site açık::https://$ALAN yanıt veriyor."
          # Bir ziyaretçinin yapacağı gibi: sayfalar, test raporu ve PDF (örnek cevaplarla; hiçbir şey saklanmaz).
          C=(curl -sS -m 30 -A 'olcekhane-yayin-denetimi')
          sorun=""
          # Uzman incelemesindeki (önizleme) testler de bağlantıyla açılmalı.
          ONIZLEME="meslek-ilgi-alanlari ayrintili-kisilik-profili alti-boyutlu-kisilik-profili duygusal-zeka-bilesenleri kisilerarasi-tarz hobi-ve-serbest-zaman-ilgileri renk-kelime-gorevi dur-git-gorevi sirayla-birlestirme-gorevi"
          for yol in / /testler /testler/oz-saygi /testler/oz-saygi/coz $(printf ' /testler/%s' $ONIZLEME) '/testler/ayrintili-kisilik-profili/coz?sinif=yetiskin' /iletisim /yasal/aydinlatma-metni; do
            kod=$("${C[@]}" -o /dev/null -w '%{http_code}' "https://$ALAN$yol") || kod=000
            [ "$kod" = 200 ] || sorun="$sorun $yol=$kod"
          done
          GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 7, "data": {"engine": "likert", "answers": {f"R{i}": {"value": i % 4, "rtMs": 2500} for i in range(1, 11)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$GOVDE" "https://$ALAN/api/rapor/oz-saygi" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["student"]["items"] and r["parent"]["items"]'; then
            sorun="$sorun rapor"
          fi
          # Meslek İlgi Alanları: 91 madde (35. madde çıkarıldı), sıralı ilgi raporu.
          ILGI_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"o{i:02d}": {"value": i % 5 + 1, "rtMs": 2500} for i in range(1, 93) if i != 35}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$ILGI_GOVDE" "https://$ALAN/api/rapor/meslek-ilgi-alanlari" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert len(r["student"]["chart"]["rows"]) == 8 and r["parent"]["items"]'; then
            sorun="$sorun ilgi-raporu"
          fi
          # Ayrıntılı Kişilik Profili: 116 madde (Liberalizm alt boyutu çıkarıldı), beş boyut ve alt özellikleri.
          KISILIK_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"k{i:03d}": {"value": i % 5 + 1, "rtMs": 2500} for i in range(1, 121) if i not in (28, 58, 88, 118)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$KISILIK_GOVDE" "https://$ALAN/api/rapor/ayrintili-kisilik-profili" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert [len(g["facets"]) for g in r["parent"]["groups"]] == [6, 6, 6, 6, 5]'; then
            sorun="$sorun kisilik-raporu"
          fi
          # Altı Boyutlu Kişilik Profili: 240 madde (24 alt özellik × 10), altı boyut ve dörder alt özellik.
          ALTI_GOVDE=$(python3 -c 'import json; p="sinc fair gree mode fear anxi depe sent expr socb soci live forg gent flex pati orga dili perf prud aesa inqu crea unco".split(); print(json.dumps({"grade": 11, "data": {"engine": "likert", "answers": {f"{k}{n:02d}": {"value": (i + n) % 5 + 1, "rtMs": 2500} for i, k in enumerate(p) for n in range(1, 11)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$ALTI_GOVDE" "https://$ALAN/api/rapor/alti-boyutlu-kisilik-profili" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert [len(g["facets"]) for g in r["parent"]["groups"]] == [4, 4, 4, 4, 4, 4]'; then
            sorun="$sorun alti-boyutlu-rapor"
          fi
          # Duygusal Zekâ Bileşenleri: 66 madde (empc04 ve empc07 çıkarıldı), yedi ayrı ölçek, toplam puan yok.
          DZ_GOVDE=$(python3 -c 'import json; n={"pexp": 9, "nexp": 10, "atte": 10, "edec": 9, "rjoy": 10, "rdis": 10, "empc": 10}; print(json.dumps({"grade": 9, "data": {"engine": "likert", "answers": {f"{k}{i:02d}": {"value": (j + i) % 5 + 1, "rtMs": 2500} for j, k in enumerate(n) for i in range(1, n[k] + 1) if f"{k}{i:02d}" not in ("empc04", "empc07")}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$DZ_GOVDE" "https://$ALAN/api/rapor/duygusal-zeka-bilesenleri" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert len(r["parent"]["chart"]["rows"]) == 7 and len(r["student"]["items"]) == 7 and "toplam bir puan yoktur" in r["student"]["chartNote"]'; then
            sorun="$sorun duygusal-zeka-raporu"
          fi
          # Kişilerarası Tarz: 32 madde, sekiz tarz çember grafiğinde.
          TARZ_GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 10, "data": {"engine": "likert", "answers": {f"ipc{i:02d}": {"value": i % 5 + 1, "rtMs": 2500} for i in range(1, 33)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$TARZ_GOVDE" "https://$ALAN/api/rapor/kisilerarasi-tarz" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); c=r["student"]["chart"]; assert c["type"] == "circle" and len(c["axes"]) == 8 and len(r["parent"]["items"]) == 8'; then
            sorun="$sorun kisilerarasi-tarz-raporu"
          fi
          # Hobi ve Serbest Zaman İlgileri: 92 etkinlik (ORAIS'teki numaralarıyla), 16 alan sıklığa göre sıralı.
          HOBI_GOVDE=$(python3 -c 'import json; n=[4,6,7,8,9,11,12,13,14,17,28,29,31,35,39,40,41,42,44,45,46,47,50,52,54,63,64,67,68,71,72,73,74,76,77,78,79,82,84,86,89,94,95,100,104,105,106,107,109,110,111,112,113,115,117,119,127,128,129,133,136,137,138,139,140,141,142,143,147,149,151,159,160,161,165,168,169,170,171,173,174,175,176,178,182,190,194,196,199,200,208,209]; print(json.dumps({"grade": 7, "data": {"engine": "likert", "answers": {f"h{k:03d}": {"value": (i * 3) % 5 + 1, "rtMs": 2500} for i, k in enumerate(n)}}}))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$HOBI_GOVDE" "https://$ALAN/api/rapor/hobi-ve-serbest-zaman-ilgileri" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); c=r["student"]["chart"]; assert c["type"] == "rulers" and len(c["rows"]) == 16 and r["student"]["chartTitle"] == "Serbest zaman etkinliklerin"'; then
            sorun="$sorun hobi-raporu"
          fi
          # Aynı test yetişkin olarak ("Yetişkinim", 14): yalnızca kişisel rapor.
          YETISKIN_GOVDE=$(printf '%s' "$KISILIK_GOVDE" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["grade"]=14; print(json.dumps(b))')
          if ! "${C[@]}" -f -H 'content-type: application/json' -d "$YETISKIN_GOVDE" "https://$ALAN/api/rapor/ayrintili-kisilik-profili" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert list(r) == ["adult"] and r["adult"]["gradeLabel"] == "Yetişkin"'; then
            sorun="$sorun yetiskin-raporu"
          fi
          # Uzman incelemesindeki testler bağlantıyla açılır ama arama motorlarına kapalıdır.
          for slug in $ONIZLEME; do
            if "${C[@]}" "https://$ALAN/testler/$slug" | grep -qi 'name="robots" content="noindex'; then
              echo "::notice title=Önizleme::/testler/$slug açılıyor; uzman incelemesinde, arama motorlarına kapalı."
            else
              echo "::notice title=Önizleme::/testler/$slug açılıyor ve herkese açık."
            fi
          done
          PDF_GOVDE=$(printf '%s' "$GOVDE" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["audience"]="parent"; print(json.dumps(b))')
          if ! "${C[@]}" -f -m 60 -H 'content-type: application/json' -d "$PDF_GOVDE" -o "$RUNNER_TEMP/rapor.pdf" \
            "https://$ALAN/api/rapor/oz-saygi/pdf" || [ "$(head -c 5 "$RUNNER_TEMP/rapor.pdf")" != '%PDF-' ]; then
            sorun="$sorun pdf"
          fi
          if [ -n "$sorun" ]; then
            echo "::error title=Site dışarıdan sınandı::Açılmayan ya da hatalı yanıt veren bölümler:$sorun"
            exit 1
          fi
          echo "::notice title=Site dışarıdan sınandı::Sayfalar, test raporu ve PDF indirme internetten çalışıyor."
          # Arama motorları: robots.txt bütün siteyi kapatıyor mu, site haritasında kaç sayfa var.
          if "${C[@]}" "https://$ALAN/robots.txt" | grep -qiE '^disallow: /[[:space:]]*$'; then
            echo "::notice title=Arama motorları::Kapalı (ALLOW_INDEXING=false): site Google'da görünmez."
          else
            sayfa=$("${C[@]}" "https://$ALAN/sitemap.xml" | grep -o '<loc>' | wc -l)
            echo "::notice title=Arama motorları::Açık: robots.txt taramaya izin veriyor, site haritasında $sayfa sayfa var."
          fi
