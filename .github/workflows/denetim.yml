# Denetim: her gönderimde tür denetimi, biçim denetimi, birim testleri ve Docker görüntüsünün derlenip sunucudaki
# gibi (salt okunur dosya sistemiyle) çalıştırılması. Üretim derlemesi görüntünün içinde, ortam değişkeni olmadan
# yapılır (Dockerfile, build aşaması); "Kod denetimi" işinde ayrıca derlenmez: aynı derleme iki kez GitHub'ın ücretsiz
# aylık çalışma süresinden yiyordu (2026-10-30).
name: Denetim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  kod:
    name: Kod denetimi ve testler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund
      - name: Tür denetimi
        run: npm run typecheck
      - name: Biçim denetimi
        run: npm run lint
      - name: Birim testleri
        run: npm test

  goruntu:
    name: Docker görüntüsü
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Görüntüyü derle
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: olcekhane-app:denetim
          cache-from: type=gha,scope=olcekhane-app
          cache-to: type=gha,mode=max,scope=olcekhane-app
      - name: Görüntüyü çalıştır (salt okunur; sayfalar, rapor, PDF, çerez ve günlük denetimi)
        # Normalde bir dakikadan kısa sürer; takılırsa (ör. paket deposu yanıt vermezse) 30 dakika beklenmesin.
        timeout-minutes: 10
        run: |
          set -eu
          # Sunucudaki ayarlarla (docker-compose.yml): salt okunur dosya sistemi, bellekte geçici klasörler.
          docker run -d --name app -p 127.0.0.1:3000:3000 --read-only \
            --tmpfs /tmp:size=64m --tmpfs /app/.next/cache:size=64m,uid=1001,gid=1001 --ulimit core=0 \
            -e APP_URL=http://localhost:3000 -e ALLOW_INDEXING=false -e TZ=Europe/Istanbul olcekhane-app:denetim
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -m 3 http://127.0.0.1:3000/api/saglik >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error title=Uygulama açılmadı::Sağlık denetimi 120 saniyede yanıt vermedi"; exit 1; }
          curl -fsS http://127.0.0.1:3000/api/saglik; echo
          C=(curl -s -m 20 -A 'denetim-ajan' -H 'X-Forwarded-For: 203.0.113.77')
          for yol in / /testler /testler/oz-saygi /testler/oz-saygi/coz '/testler/oz-saygi/coz?sinif=7' /veliler-icin /bilimsel-yaklasim \
            /rehber /hakkimizda /iletisim /yasal/aydinlatma-metni /yasal/kullanim-kosullari /yasal/cerez-politikasi /robots.txt /sitemap.xml; do
            kod=$("${C[@]}" -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$yol")
            echo "$yol -> $kod"
            [ "$kod" = 200 ] || { echo "::error title=Sayfa açılmadı::$yol $kod döndü"; exit 1; }
          done
          # Kaldırılan bölümler (hesap, giriş, okul, yönetim, iletişim formu) yoktur.
          for yol in /giris /kayit /panel /okul /okullar-icin /yonetim /hesap /hizli-test/oz-saygi /yasal/acik-riza-olcme; do
            kod=$("${C[@]}" -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$yol")
            echo "$yol -> $kod"
            [ "$kod" = 404 ] || { echo "::error title=Kaldırılan sayfa açık::$yol $kod döndü (404 bekleniyordu)"; exit 1; }
          done
          # Sesli okumada otomatik analiz: konuşma tanıma modeli ve ONNX Runtime dosyaları görüntüde eksiksiz ve kendi
          # sunucumuzdan iniyor (yalnızca başlıklar; model dosyalarının boyutu betikteki sabit boyutla karşılaştırılır).
          node araclar/model-hazirla.mjs --adresler > /tmp/adresler.txt || { echo "::error title=Otomatik analiz::Dosya adresleri alınamadı (araclar/model-hazirla.mjs --adresler)"; exit 1; }
          while read -r yol boyut; do
            "${C[@]}" -I "http://127.0.0.1:3000$yol" | tr -d '\r' > /tmp/dosya.baslik || true
            kod=$(awk 'NR==1 {print $2}' /tmp/dosya.baslik)
            uzunluk=$(awk -F': ' 'tolower($1) == "content-length" {print $2}' /tmp/dosya.baslik)
            [ "$kod" = 200 ] || { echo "::error title=Otomatik analiz dosyası::$yol $kod döndü"; exit 1; }
            [ "$boyut" = - ] || [ "$uzunluk" = "$boyut" ] || { echo "::error title=Otomatik analiz dosyası::$yol $uzunluk bayt (beklenen $boyut)"; exit 1; }
            case "$yol" in
              *.wasm) grep -qi '^content-type: application/wasm' /tmp/dosya.baslik || { echo "::error title=Otomatik analiz dosyası::$yol application/wasm olarak sunulmuyor"; exit 1; } ;;
            esac
          done < /tmp/adresler.txt
          "${C[@]}" -D - -o /dev/null 'http://127.0.0.1:3000/testler/sesli-okuma-degerlendirmesi/coz?sinif=3' | grep -qi '^cross-origin-embedder-policy: require-corp' ||
            { echo "::error title=Otomatik analiz::Sesli okuma testi cross-origin isolated değil (COEP başlığı yok)"; exit 1; }
          # Rapor: saklamadan puanlama ve PDF (öz-saygı ölçeği, 7. sınıf, örnek cevaplar).
          GOVDE=$(python3 -c 'import json; print(json.dumps({"grade": 7, "data": {"engine": "likert", "answers": {f"R{i}": {"value": i % 4, "rtMs": 2500} for i in range(1, 11)}}}))')
          "${C[@]}" -f -D /tmp/rapor.baslik -H 'content-type: application/json' -d "$GOVDE" http://127.0.0.1:3000/api/rapor/oz-saygi \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["student"]["items"] and r["parent"]["items"], r; print("rapor:", r["student"]["chartTitle"])'
          PDF_GOVDE=$(printf '%s' "$GOVDE" | python3 -c 'import json,sys; b=json.load(sys.stdin); b["audience"]="parent"; print(json.dumps(b))')
          "${C[@]}" -f -m 60 -H 'content-type: application/json' -d "$PDF_GOVDE" -o /tmp/rapor.pdf http://127.0.0.1:3000/api/rapor/oz-saygi/pdf
          head -c 5 /tmp/rapor.pdf | grep -q '%PDF-' || { echo "::error title=PDF üretilemedi::Yanıt bir PDF değil"; exit 1; }
          echo "PDF: $(wc -c < /tmp/rapor.pdf) bayt"
          # PDF'teki metin okunabilir olmalı: Türkçe harfler, saklamama notu ve sayfa numarası (alt bilgi).
          # Metin pdftotext varsa onunla, yoksa pip'ten kurulan pypdf ile çıkarılır: 2026-10-07'de çalıştırıcıda pdftotext
          # yoktu ve paket deposundan (apt) kurulum önce takıldı, sonra kurulmadan geçildi.
          if command -v pdftotext >/dev/null; then
            pdftotext /tmp/rapor.pdf /tmp/rapor.txt
          else
            timeout 180 python3 -m pip install -q --disable-pip-version-check --user --break-system-packages pypdf
            python3 -c 'import pypdf, sys; r = pypdf.PdfReader(sys.argv[1]); open(sys.argv[2], "w", encoding="utf-8").write("\n".join(p.extract_text() or "" for p in r.pages))' /tmp/rapor.pdf /tmp/rapor.txt
          fi
          for ifade in 'Öz-saygı Ölçeği' 'hiçbir' 'Sayfa 1 / ' 'Veli raporu'; do
            grep -q "$ifade" /tmp/rapor.txt || { echo "::error title=PDF metni eksik::'$ifade' bulunamadı"; cat /tmp/rapor.txt; exit 1; }
          done
          # Çerez yoktur: sayfalar ve rapor ucu Set-Cookie göndermez.
          for yol in / '/testler/oz-saygi/coz?sinif=7' /yasal/aydinlatma-metni; do
            if "${C[@]}" -D - -o /dev/null "http://127.0.0.1:3000$yol" | grep -qi '^set-cookie:'; then echo "::error title=Çerez::$yol çerez gönderdi"; exit 1; fi
          done
          if grep -qi '^set-cookie:' /tmp/rapor.baslik; then echo "::error title=Çerez::Rapor ucu çerez gönderdi"; exit 1; fi
          # Hiçbir şey saklanmaz: dosya sistemi salt okunur (her yazma reddedilir); yazılabilen tek yerler olan
          # bellekteki geçici klasörlerde de dosya oluşmadı; günlükte istek bilgisi yok.
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' app)" = true
          if docker exec app sh -c 'touch /app/deneme' 2>/dev/null; then echo "::error title=Diske yazıldı::Kapsayıcının dosya sistemine yazılabildi"; exit 1; fi
          dosyalar=$(docker exec app find /tmp /app/.next/cache -type f)
          [ -z "$dosyalar" ] || { echo "::error title=Geçici dosya::$dosyalar"; exit 1; }
          docker logs app > /tmp/app.log 2>&1
          for iz in 203.0.113.77 denetim-ajan sinif=7 rtMs '"R1"'; do
            if grep -q -- "$iz" /tmp/app.log; then echo "::error title=Günlükte istek bilgisi::'$iz' günlükte geçiyor"; cat /tmp/app.log; exit 1; fi
          done
          echo "Günlük ($(wc -l < /tmp/app.log) satır):"; cat /tmp/app.log
      - name: Hata ayrıntıları
        if: failure()
        run: |
          # Kayıtların son satırları uyarı olarak da yazılır: çalışma kayıtlarına erişilemediğinde de okunabilsinler.
          docker logs app > /tmp/app.log 2>&1 || exit 0
          echo "===== app ====="; tail -n 80 /tmp/app.log
          msg=$(tail -n 40 /tmp/app.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=app kaydı (son 40 satır)::$msg"
