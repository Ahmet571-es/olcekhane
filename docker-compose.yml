# Ölçekhane: tek sunucuda çalışan kurulum (bkz. KURULUM.md).
#   docker compose up -d --build
# Değişkenler .env dosyasından okunur (.env.example'dan kopyalayın).
#
# Sitede veritabanı yoktur ve hiçbir şey saklanmaz: yalnızca uygulama ve önündeki Caddy (HTTPS) çalışır.

name: olcekhane

# Kapsayıcı günlükleri boyutla sınırlı ve döngüseldir. Uygulama günlüğe yalnızca hata özeti yazar (istek
# gövdesi, test cevapları ya da IP adresi yazılmaz); Caddy isteklerle ilgili hiçbir şey yazmaz (Caddyfile).
x-gunluk: &gunluk
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: olcekhane-app:latest
    restart: unless-stopped
    logging: *gunluk
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Istanbul
    # Salt okunur dosya sistemi: uygulama diske hiçbir şey yazamaz. Next.js'in geçici dosyaları için
    # yalnızca bellekte duran (tmpfs) iki klasör vardır.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=64m,uid=1001,gid=1001
    # Uygulama çökse bile belleğinin dökümü (içinde işlenmekte olan cevaplar olabilir) diske yazılmaz.
    ulimits:
      core: 0
    networks: [ic]
    # Uygulama dışarıya açılmaz: yalnızca Caddy üzerinden erişilir (hız sınırı Caddy'nin ilettiği IP
    # adresine güvenir).

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *gunluk
    # Yalnızca IPv4: kapsayıcı ağı IPv6 kullanmadığı için Docker, IPv6 bağlantılarını ağ geçidi
    # adresinden iletirdi ve bütün IPv6 ziyaretçileri tek bir IP adresinden geliyormuş gibi görünürdü
    # (hız sınırı hepsine birlikte uygulanırdı). Alan adına AAAA kaydı eklemeyin (KURULUM.md).
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN .env dosyasında tanımlı olmalı}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL .env dosyasında tanımlı olmalı}
      CADDY_GENEL_AYAR: ${CADDY_GENEL_AYAR:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Yalnızca HTTPS sertifikaları ve Caddy'nin kendi ayarları (ziyaretçi verisi değil).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks: [ic]

volumes:
  caddy-data:
  caddy-config:

networks:
  ic:
