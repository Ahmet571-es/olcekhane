# Ölçekhane: tek sunucuda çalışan kurulum (Türkiye'deki bir sunucu için; bkz. KURULUM.md).
#   docker compose up -d --build
# Değişkenler .env dosyasından okunur (.env.example'dan kopyalayın).

name: olcekhane

# Kapsayıcı günlükleri boyutla sınırlı ve döngüseldir; kapsayıcı yeniden oluşturulunca silinir. Hata
# ayrıntılarında seyrek de olsa kişisel veri bulunabilir (bkz. KURULUM.md, Güvenlik notları).
x-gunluk: &gunluk
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # Hata kayıtlarına ayrıntı satırı (ör. "Key (email)=(...) already exists") yazılmasın.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    logging: *gunluk
    environment:
      POSTGRES_DB: olcekhane
      POSTGRES_USER: olcekhane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
      TZ: Europe/Istanbul
    volumes:
      # PostgreSQL 18 görüntüsü veriyi /var/lib/postgresql/18/docker altında tutar.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olcekhane -d olcekhane"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ic]
    # Veritabanı dışarıya açılmaz: yalnızca iç ağdaki uygulama ve yedek kapsayıcısı erişir.

  app:
    build: .
    image: olcekhane-app:latest
    restart: unless-stopped
    logging: *gunluk
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://olcekhane:${POSTGRES_PASSWORD}@db:5432/olcekhane
      TZ: Europe/Istanbul
    depends_on:
      db:
        condition: service_healthy
    networks: [ic]
    # Uygulama dışarıya açılmaz: yalnızca Caddy üzerinden erişilir (IP adresleri buna güvenir).

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *gunluk
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN .env dosyasında tanımlı olmalı}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL .env dosyasında tanımlı olmalı}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks: [ic]

  yedek:
    image: postgres:18
    restart: unless-stopped
    logging: *gunluk
    environment:
      PGHOST: db
      PGUSER: olcekhane
      PGDATABASE: olcekhane
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_TIME: ${BACKUP_TIME:-03:15}
      TZ: Europe/Istanbul
    volumes:
      - ./yedekler:/yedekler
      - ./docker/backup.sh:/usr/local/bin/yedekle:ro
    entrypoint: ["bash", "/usr/local/bin/yedekle"]
    depends_on:
      db:
        condition: service_healthy
    networks: [ic]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  ic:
